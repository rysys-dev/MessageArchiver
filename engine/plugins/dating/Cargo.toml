[package]
name = "ma-dating"
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "What MessageArchiver's Tinder and Hinge plug-ins share: the apps' data downloads, read-only, as NDJSON"
publish = false

# chrono at the version ma-engine pins.
[dependencies]
ma-protocol = { path = "../../protocol" }
chrono = "=0.4.45"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
