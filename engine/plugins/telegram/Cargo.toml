[package]
name = "ma-telegram"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "MessageArchiver's Telegram plug-in: reads Telegram's data export (JSON) read-only, as NDJSON (Milestone 21)"
publish = false

# chrono at the version ma-engine pins.
[dependencies]
ma-protocol = { path = "../../protocol" }
chrono = "=0.4.45"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
