[package]
name = "ma-googlevoice"
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "MessageArchiver's Google Voice plug-in: reads Google Voice in a Google Takeout download (HTML) read-only, as NDJSON (Milestone 28)"
publish = false

# chrono at the version ma-engine pins. The Takeout's pages are read by a small reader of its own
# (src/html.rs): no HTML library.
[dependencies]
ma-protocol = { path = "../../protocol" }
chrono = "=0.4.45"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
