[package]
name = "ma-backup"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Reading iPhone backups Finder made, encrypted or not, for MessageArchiver's engines (Milestones 11, 19)"
publish = false

# crabapple (same author as imessage-database, GPL-3.0) decrypts; plist and sha1 at the versions
# crabapple and ma-engine pin.
[dependencies]
crabapple = "=0.4.7"
plist = "=1.10.0"
sha1 = "=0.11.0"
serde_json = "1"
